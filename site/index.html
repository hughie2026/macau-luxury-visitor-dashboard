<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界地圖｜澳門奢侈品牌 × 國際旅客</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <nav id="nav"></nav>
  <main class="map-layout">
    <aside class="sidebar">
      <section>
        <h2>指標</h2>
        <label>著色指標
          <select id="metric">
            <option value="news">新聞報道強度</option>
            <option value="visitors">入境旅客人次</option>
            <option value="spending">人均購物消費</option>
            <option value="tone">新聞平均情緒</option>
            <option value="bivariate">雙變量：報道強度 × 人均購物</option>
          </select>
        </label>
        <label>品牌 <select id="brand"></select></label>
        <label class="check"><input type="checkbox" id="exclude-gc"> 排除中國內地、香港、台灣</label>
        <label class="check"><input type="checkbox" id="flows" checked> 顯示客流飛線</label>
      </section>
      <section>
        <h2>時間：<span id="month-label">—</span></h2>
        <input type="range" id="month" min="0" max="0" value="0">
        <button id="play" type="button">▶ 播放</button>
      </section>
      <section>
        <h2>圖例</h2>
        <div id="legend"></div>
      </section>
      <section id="panel" class="panel">
        <p class="hint">點擊國家查看詳情。</p>
      </section>
    </aside>
    <div id="map" class="map"></div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="assets/js/world.js"></script>
</body>
</html>
