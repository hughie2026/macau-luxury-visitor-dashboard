name: Update data and deploy

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "GDELT 文章回填最近 3 個月"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "data/manual/**", "config/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: scripts
    env:
      USER_AGENT: macau-luxury-visitor-dashboard (https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ../requirements.txt

      - name: Static data
        run: python fetch_static.py

      - name: Fetch sources
        if: github.event_name != 'push'
        env:
          GDELT_BACKFILL: ${{ inputs.backfill }}
        run: |
          python fetch_gdelt.py      || echo "::warning::GDELT 抓取失敗"
          python fetch_wiki.py       || echo "::warning::Wikimedia 抓取失敗"
          python fetch_osm.py        || echo "::warning::OSM 抓取失敗"
          python fetch_fx.py         || echo "::warning::匯率抓取失敗"
          python fetch_worldbank.py  || echo "::warning::World Bank 抓取失敗"

      - name: Build
        run: python build.py

      - name: Commit data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
